name: BizFlow CI

#什么时候触发
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    #使用github提供的ubuntu机器
    runs-on: ubuntu-latest


    steps:

      #第一步：拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v4


      #第二步：安装Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      #第三步：安装依赖
      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      #第四步：执行测试
      - name: Run tests
        run: |
          pytest