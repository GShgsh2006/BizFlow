name: BizFlow CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4


      # Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ✅ 修改了这里：去掉了 BizFlow/ 前缀
          pip install -r requirements.txt
          pip install pytest pytest-asyncio


      # 设置Python搜索路径
      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV


      # 执行测试
      - name: Run tests
        run: |
          python -m pytest BizFlow/hdwj/test_pytext -v