name: BizFlow CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4


      # Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio


      # 设置测试环境变量
      # 防止项目导入数据库配置时因为没有 .env 报错
      - name: Set test environment
        run: |
          echo "HOSTNAME=localhost" >> $GITHUB_ENV
          echo "PORT=3306" >> $GITHUB_ENV
          echo "USERNAME=test" >> $GITHUB_ENV
          echo "PASSWORD=test" >> $GITHUB_ENV
          echo "DATABASE=test" >> $GITHUB_ENV


      # 设置 Python 包搜索路径
      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV


      # 执行测试
      - name: Run tests
        run: |
          python -m pytest BizFlow/hdwj/test_pytext -v